<header class="sticky top-0 z-50 border-b border-cv-primary/10 bg-white/95 backdrop-blur">
  <div class="mx-auto flex min-h-20 max-w-7xl items-center justify-between gap-6 px-6 sm:px-8 lg:px-12">
    <a
      href="#home"
      class="rounded-lg text-lg font-bold tracking-tight text-cv-primary transition-colors hover:text-cv-primary-dark"
      aria-label="Revenir à l’accueil"
      (click)="closeMenu()"
    >
      <span aria-hidden="true">EVA</span>
    </a>

    <nav class="hidden md:block" aria-label="Navigation principale">
      <ul class="flex items-center gap-1">
        @for (item of navigationItems; track item.fragment) {
          <li>
            <a
              [attr.href]="'#' + item.fragment"
              class="block rounded-lg px-3 py-2 text-sm font-medium text-cv-muted transition-colors hover:bg-cv-soft hover:text-cv-primary-dark focus-visible:text-cv-primary-dark"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <button
      type="button"
      class="inline-flex size-11 items-center justify-center rounded-xl text-cv-primary transition-colors hover:bg-cv-soft hover:text-cv-primary-dark md:hidden"
      aria-controls="mobile-navigation"
      [attr.aria-expanded]="isMenuOpen()"
      [attr.aria-label]="isMenuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
      (click)="toggleMenu()"
    >
      @if (isMenuOpen()) {
        <svg aria-hidden="true" viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" />
        </svg>
      } @else {
        <svg aria-hidden="true" viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      }
    </button>
  </div>

  @if (isMenuOpen()) {
    <nav id="mobile-navigation" class="border-t border-cv-primary/10 bg-white px-6 py-4 md:hidden" aria-label="Navigation mobile">
      <ul class="mx-auto grid max-w-7xl gap-1">
        @for (item of navigationItems; track item.fragment) {
          <li>
            <a
              [attr.href]="'#' + item.fragment"
              class="block rounded-xl px-4 py-3 font-medium text-cv-muted transition-colors hover:bg-cv-soft hover:text-cv-primary-dark focus-visible:text-cv-primary-dark"
              (click)="closeMenu()"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  }
</header>
