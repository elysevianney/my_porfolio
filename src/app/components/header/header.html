<header class="site-header">
  <div class="header-inner shell">
    <a href="#home" class="wordmark" aria-label="Revenir à l’accueil" (click)="closeMenu()"
      ><span class="brand-shape" aria-hidden="true"></span
      ><span aria-hidden="true">VIANNEY<span class="brand-dot">.</span></span></a
    >
    <nav class="hidden md:block" aria-label="Navigation principale">
      <ul class="desktop-links">
        @for (item of navigationItems; track item.fragment) {
          <li>
            <a
              [attr.href]="'#' + item.fragment"
              [attr.aria-current]="activeSection() === item.fragment ? 'location' : null"
              [class.nav-contact]="item.fragment === 'contact'"
              >{{ item.label }}
              @if (item.fragment === 'contact') {
                <span aria-hidden="true">↗</span>
              }
            </a>
          </li>
        }
      </ul>
    </nav>
    <button
      #menuButton
      type="button"
      class="menu-toggle md:hidden"
      aria-controls="mobile-navigation"
      [attr.aria-expanded]="isMenuOpen()"
      [attr.aria-label]="isMenuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
      (click)="toggleMenu()"
    >
      <svg
        aria-hidden="true"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        @if (isMenuOpen()) {
          <path d="m6 6 12 12M6 18 18 6" />
        } @else {
          <path d="M4 8h16M4 16h16" />
        }
      </svg>
    </button>
  </div>
  @if (isMenuOpen()) {
    <nav id="mobile-navigation" class="mobile-navigation md:hidden" aria-label="Navigation mobile">
      <ul>
        @for (item of navigationItems; track item.fragment) {
          <li>
            <a
              [attr.href]="'#' + item.fragment"
              [attr.aria-current]="activeSection() === item.fragment ? 'location' : null"
              (click)="closeMenu()"
              >{{ item.label }}<span aria-hidden="true">↗</span></a
            >
          </li>
        }
      </ul>
    </nav>
  }
  <div
    class="reading-progress"
    [style.transform]="'scaleX(' + readingProgress() + ')'"
    aria-hidden="true"
  ></div>
</header>
